# JupyterHub docker-compose configuration file
services:
  hub:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    image: jupyterhub-local
    container_name: jupyterhub
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterhub-data:/data
      - ./jupyterhub-system-data:/srv/jupyterhub
      - ./jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py
      - ./create-admin.py:/srv/jupyterhub/create-admin.py
      # SSL certificates for HTTPS
      - ./ssl/jupyterhub.crt:/srv/jupyterhub/jupyterhub.crt
      - ./ssl/jupyterhub.key:/srv/jupyterhub/jupyterhub.key
      # Data directory for user notebooks with proper permissions
      - jupyterhub-user-data:/srv/jupyterhub/data
    ports:
      # HTTP port (uncomment for HTTP mode)
      # - "8000:8000"
      # HTTPS port (currently active)
      - "8443:8443"
    environment:
      - DOCKER_NOTEBOOK_IMAGE=jupyter/base-notebook:latest
      - DOCKER_NETWORK_NAME=jupyterhub-network
      - DOCKER_NOTEBOOK_DIR=/home/jovyan/work
      # Admin user
      - JUPYTERHUB_ADMIN=admin
      # SSL certificate paths (for HTTPS)
      - JUPYTERHUB_SSL_CERT=/srv/jupyterhub/jupyterhub.crt
      - JUPYTERHUB_SSL_KEY=/srv/jupyterhub/jupyterhub.key
      # GPU configuration for spawned containers
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - jupyterhub-network

volumes:
  jupyterhub-data:
  jupyterhub-user-data:

networks:
  jupyterhub-network:
    name: jupyterhub-network
